name: Family Calendar Conflict Detector

# Runs on a schedule and sends an email when a newly-scheduled event on the
# Family calendar overlaps an existing one. Needs two repo secrets:
#   GOOGLE_TOKEN_JSON  - contents of token.json from `python3 monitor.py auth`
#   SMTP_PASSWORD      - Gmail app password for sending
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay under load)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

concurrency:
  group: family-calendar-conflict
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-calendar-conflict-detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the de-dup state across runs so the same conflict is not
      # emailed twice. A fresh unique key each run always saves forward;
      # restore-keys pulls the most recent previous state.
      - name: Restore de-dup state
        uses: actions/cache@v4
        with:
          path: family-calendar-conflict-detector/state.json
          key: conflict-state-${{ github.run_id }}
          restore-keys: |
            conflict-state-

      - name: Write Google token
        run: printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Run conflict check
        run: python3 monitor.py run
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: edeitrick@gmail.com
          SMTP_FROM: edeitrick@gmail.com
          ALERT_RECIPIENTS: edeitrick@gmail.com,davidcpcu@gmail.com
          FAMILY_CALENDAR_ID: family04215781631001689506@group.calendar.google.com
          WINDOW_MINUTES: "30"
          LOOKAHEAD_DAYS: "360"
          USE_CREATOR_FALLBACK: "false"

      - name: Clean up token
        if: always()
        run: rm -f token.json
